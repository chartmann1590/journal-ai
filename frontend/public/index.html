<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111318" />
    <meta name="description" content="AI-assisted journaling platform" />
    <meta name="application-name" content="Journal AI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Journal AI" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/Icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/Icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/Icon-512.png" />
    <title>Journal AI</title>
    <style>
      /* Lightweight animated splash overlay */
      .splash{position:fixed;inset:0;background:radial-gradient(1200px 800px at 10% -10%,#1f2330 0%,rgba(17,19,24,0) 70%),linear-gradient(160deg,#111318 0%,#161a22 100%);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s ease, visibility .4s ease;}
      .splash.hide{opacity:0;visibility:hidden}
      .splash-inner{display:flex;flex-direction:column;align-items:center;gap:14px;transform:translateY(0);animation:rise .9s ease both}
      .splash-logo{width:96px;height:96px;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.45);animation:pulse 1.6s ease-in-out infinite}
      .splash-title{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial;letter-spacing:.3px;color:#e6e8ec;font-weight:700;font-size:20px;text-shadow:0 1px 0 rgba(0,0,0,.2)}
      .splash-anim{display:flex;gap:6px;margin-top:2px}
      .splash-anim span{width:6px;height:6px;border-radius:50%;background:#3b82f6;opacity:.75;animation:blink 1.2s infinite}
      .splash-anim span:nth-child(2){animation-delay:.2s}
      .splash-anim span:nth-child(3){animation-delay:.4s}
      .splash-progress{width:180px;height:6px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:8px}
      .splash-progress .bar{width:0;height:100%;background:linear-gradient(90deg,#2563eb 0%,#60a5fa 100%);animation:loadbar 5s linear forwards}
      @keyframes blink{0%,80%,100%{transform:translateY(0);opacity:.75}40%{transform:translateY(-5px);opacity:1}}
      @keyframes pulse{0%,100%{filter:drop-shadow(0 12px 40px rgba(41,98,255,.25))}50%{filter:drop-shadow(0 12px 52px rgba(41,98,255,.5))}}
      @keyframes rise{from{transform:translateY(8px);opacity:.8}to{transform:translateY(0);opacity:1}}
      @keyframes loadbar{from{width:0}to{width:100%}}
    </style>
    <script>
      // Track splash start to ensure a minimum visible time
      window.__splashStart = performance.now();
      window.__hideSplash = function(){
        try{
          var el=document.getElementById('splash'); if(!el) return;
          var minMs=5000; // at least 5 seconds
          var elapsed=performance.now()-window.__splashStart;
          var remaining=Math.max(0, minMs - elapsed);
          setTimeout(function(){
            el.classList.add('hide');
            setTimeout(function(){ el.parentNode && el.parentNode.removeChild(el); }, 450);
          }, remaining);
        }catch(e){}
      };
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="splash" class="splash">
      <div class="splash-inner">
        <img class="splash-logo" src="/icons/Icon-maskable-512.png" alt="Journal AI logo" />
        <div class="splash-title">Journal AI</div>
        <div class="splash-anim"><span></span><span></span><span></span></div>
        <div class="splash-progress"><div class="bar"></div></div>
      </div>
    </div>
  </body>
</html>
