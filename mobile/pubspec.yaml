name: journal_ai_mobile
description: Android Flutter client for Journal AI
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  table_calendar: ^3.0.9
  intl: ^0.19.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  android_intent_plus: ^5.1.0
  package_info_plus: ^8.0.2
  workmanager: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
dependency_overrides:
  win32: ^5.5.0
